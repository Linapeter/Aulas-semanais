[project]
name = "exercises"
version = "0.1.0"
description = ""
authors = [
    {name = "Linapeter",email = "linapark331@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "num2word (>=1.0.1,<2.0.0)",
    "num2words (>=0.5.14,<0.6.0)",
    "numbers2words (>=0.1,<0.2)",
    "numpy (>=2.3.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"
pytest-profiling = "^1.8.1"
snakeviz = "^2.2.2"
mypy = "1.15"
radon = "5.1"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra", "-q", "-p", "profiling"]
pythonpath = "./src"
testpaths = ["tests"]
 
[tool.coverage.run]
omit = ["tests/*"]
 
[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = ["src"]
 
[tool.ruff]
extend-include = ["*.ipynb"]